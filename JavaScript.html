<script>
(function () {
  var PAGE_SIZE = 30;

  var form = document.getElementById('form');
  var descriptionInput = document.getElementById('description');
  var amountInput = document.getElementById('amount');
  var dateInput = document.getElementById('date');
  var typeInput = document.getElementById('type');
  var notesInput = document.getElementById('notes');
  var balanceElement = document.getElementById('balance');
  var incomeTotalElement = document.getElementById('income-total');
  var expenseTotalElement = document.getElementById('expense-total');
  var themeToggle = document.getElementById('theme-toggle');
  var submitBtn = document.getElementById('submit-btn');
  var fab = document.getElementById('fab-add');
  var formSection = document.getElementById('form-section');

  var recentList = document.getElementById('recent-transactions');
  var viewAllBtn = document.getElementById('view-all-btn');

  var historyList = document.getElementById('history-transactions');
  var historyFilterType = document.getElementById('history-filter-type');
  var historyFilterSearch = document.getElementById('history-filter-search');
  var historyPagination = document.getElementById('history-pagination');

  var tabButtons = document.querySelectorAll('.tab-btn');
  var pages = document.querySelectorAll('.app-page');

  var reportFromInput = document.getElementById('report-from');
  var reportToInput = document.getElementById('report-to');
  var generateReportBtn = document.getElementById('generate-report-btn');
  var reportPreview = document.getElementById('report-preview');
  var downloadPdfBtn = document.getElementById('download-pdf-btn');

  var transactions = [];
  var reportData = null;
  var historyPage = 1;

  var savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeToggle.checked = savedTheme === 'dark';

  init();

  function init() {
    var today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
    initReportDates();
    loadTransactions();
  }

  function loadTransactions() {
    var loadingHtml = '<li class="no-transactions"><i class="fas fa-spinner fa-spin"></i> Loading...</li>';
    recentList.innerHTML = loadingHtml;
    historyList.innerHTML = loadingHtml;
    google.script.run
      .withSuccessHandler(function (data) {
        transactions = data || [];
        updateUI();
      })
      .withFailureHandler(handleError)
      .getTransactions();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validateForm()) return;

    var tx = {
      description: descriptionInput.value.trim(),
      amount: parseFloat(amountInput.value),
      date: dateInput.value,
      type: typeInput.value,
      notes: notesInput.value.trim()
    };

    setSubmitting(true);
    google.script.run
      .withSuccessHandler(function (data) {
        transactions = data || [];
        historyPage = 1;
        updateUI();
        resetForm();
        setSubmitting(false);
        showSuccessMessage('Transaction added successfully!');
        if (window.innerWidth <= 768) formSection.classList.remove('active');
      })
      .withFailureHandler(function (err) {
        setSubmitting(false);
        handleError(err);
      })
      .addTransaction(tx);
  });

  themeToggle.addEventListener('change', function () {
    var theme = this.checked ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  });

  fab.addEventListener('click', function () {
    formSection.classList.toggle('active');
    if (formSection.classList.contains('active')) {
      formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      descriptionInput.focus();
    }
  });

  viewAllBtn.addEventListener('click', function () {
    switchTab('history');
  });

  /* ---------------- Tabs ---------------- */
  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      switchTab(btn.getAttribute('data-page'));
    });
  });

  function switchTab(target) {
    tabButtons.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-page') === target);
    });
    pages.forEach(function (p) {
      p.classList.toggle('active', p.id === 'page-' + target);
    });
    // Floating add-transaction button is only relevant on the Dashboard
    fab.style.display = target === 'dashboard' ? '' : 'none';
  }

  function setSubmitting(isSubmitting) {
    submitBtn.disabled = isSubmitting;
    submitBtn.querySelector('span').textContent = isSubmitting ? 'Adding...' : 'Add Transaction';
  }

  /* ---------------- Rendering ---------------- */

  function updateUI() {
    renderRecent();
    renderHistory();
    updateBalance();
    updateSummary();
  }

  function renderRecent() {
    renderList(transactions.slice(0, 10), recentList);
  }

  function filterHistoryTransactions() {
    var typeFilter = historyFilterType.value;
    var search = historyFilterSearch.value.trim().toLowerCase();
    return transactions.filter(function (t) {
      var typeMatch = typeFilter === 'all' || t.type === typeFilter;
      var searchMatch = !search ||
        (t.description && t.description.toLowerCase().indexOf(search) !== -1) ||
        (t.notes && t.notes.toLowerCase().indexOf(search) !== -1);
      return typeMatch && searchMatch;
    });
  }

  function renderHistory() {
    var filtered = filterHistoryTransactions();
    var totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    if (historyPage > totalPages) historyPage = totalPages;
    if (historyPage < 1) historyPage = 1;

    var startIdx = (historyPage - 1) * PAGE_SIZE;
    var pageItems = filtered.slice(startIdx, startIdx + PAGE_SIZE);

    renderList(pageItems, historyList);
    renderPagination(totalPages, filtered.length);
  }

  historyFilterType.addEventListener('change', function () { historyPage = 1; renderHistory(); });
  historyFilterSearch.addEventListener('input', function () { historyPage = 1; renderHistory(); });

  function renderPagination(totalPages, totalItems) {
    historyPagination.innerHTML = '';
    if (totalPages <= 1) return;

    function makeBtn(label, page, opts) {
      opts = opts || {};
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'page-btn' + (opts.active ? ' active' : '');
      btn.textContent = label;
      if (opts.disabled) {
        btn.disabled = true;
      } else if (!opts.active) {
        btn.addEventListener('click', function () {
          historyPage = page;
          renderHistory();
          historyPagination.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      }
      return btn;
    }

    historyPagination.appendChild(makeBtn('\u2039', historyPage - 1, { disabled: historyPage === 1 }));

    var windowSize = 1;
    var start = Math.max(1, historyPage - windowSize);
    var end = Math.min(totalPages, historyPage + windowSize);

    if (start > 1) {
      historyPagination.appendChild(makeBtn('1', 1));
      if (start > 2) {
        var dots1 = document.createElement('span');
        dots1.className = 'page-ellipsis';
        dots1.textContent = '\u2026';
        historyPagination.appendChild(dots1);
      }
    }

    for (var p = start; p <= end; p++) {
      historyPagination.appendChild(makeBtn(String(p), p, { active: p === historyPage }));
    }

    if (end < totalPages) {
      if (end < totalPages - 1) {
        var dots2 = document.createElement('span');
        dots2.className = 'page-ellipsis';
        dots2.textContent = '\u2026';
        historyPagination.appendChild(dots2);
      }
      historyPagination.appendChild(makeBtn(String(totalPages), totalPages));
    }

    historyPagination.appendChild(makeBtn('\u203A', historyPage + 1, { disabled: historyPage === totalPages }));
  }

  function renderList(list, targetUl) {
    targetUl.innerHTML = '';
    if (list.length === 0) {
      targetUl.innerHTML = '<li class="no-transactions"><i class="fas fa-coins"></i> No transactions found</li>';
      return;
    }
    list.forEach(function (t) {
      targetUl.appendChild(buildTransactionLi(t));
    });
  }

  function buildTransactionLi(t) {
    var sign = t.type === 'income' ? '+' : '-';
    var li = document.createElement('li');
    li.classList.add('transaction', t.type);

    var notesHtml = t.notes
      ? '<div class="transaction-notes">' + escapeHtml(t.notes) + '</div>'
      : '';

    li.innerHTML =
      '<div class="transaction-info">' +
        '<div class="transaction-description">' + escapeHtml(t.description) + '</div>' +
        '<span class="transaction-category">' + (t.type === 'income' ? 'Income' : 'Expense') + '</span>' +
        '<div class="transaction-date">' + formatDate(t.date) + '</div>' +
        notesHtml +
      '</div>' +
      '<div class="transaction-amount">' + sign + '\u20B9' + Math.abs(t.amount).toFixed(2) + '</div>' +
      '<button class="delete-btn" data-id="' + t.id + '" aria-label="Delete transaction"><i class="fas fa-trash-alt"></i></button>';

    li.querySelector('.delete-btn').addEventListener('click', function () {
      var id = this.getAttribute('data-id');
      if (!confirm('Delete this transaction?')) return;
      this.disabled = true;
      google.script.run
        .withSuccessHandler(function (data) {
          transactions = data || [];
          updateUI();
          showSuccessMessage('Transaction deleted!');
        })
        .withFailureHandler(handleError)
        .deleteTransaction(id);
    });

    return li;
  }

  function updateBalance() {
    var total = transactions.reduce(function (acc, t) {
      return acc + (t.type === 'income' ? t.amount : -t.amount);
    }, 0);
    balanceElement.textContent = '\u20B9' + total.toFixed(2);
    balanceElement.style.color = total > 0 ? 'var(--income-color)' : (total < 0 ? 'var(--expense-color)' : 'inherit');
  }

  function updateSummary() {
    var income = transactions
      .filter(function (t) { return t.type === 'income'; })
      .reduce(function (acc, t) { return acc + t.amount; }, 0);
    var expense = transactions
      .filter(function (t) { return t.type === 'expense'; })
      .reduce(function (acc, t) { return acc + t.amount; }, 0);
    incomeTotalElement.textContent = '\u20B9' + income.toFixed(2);
    expenseTotalElement.textContent = '\u20B9' + expense.toFixed(2);
  }

  function resetForm() {
    form.reset();
    var today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
  }

  function validateForm() {
    if (descriptionInput.value.trim() === '') {
      showErrorMessage('Please enter a description');
      descriptionInput.focus();
      return false;
    }
    if (amountInput.value === '' || parseFloat(amountInput.value) <= 0) {
      showErrorMessage('Please enter a valid amount greater than 0');
      amountInput.focus();
      return false;
    }
    if (dateInput.value === '') {
      showErrorMessage('Please select a date');
      dateInput.focus();
      return false;
    }
    return true;
  }

  function handleError(err) {
    setSubmitting(false);
    var message = (err && err.message) ? err.message : 'Something went wrong. Please try again.';
    showErrorMessage(message);
    console.error(err);
  }

  function showSuccessMessage(msg) { showToast(msg, 'success', 'fa-check-circle'); }
  function showErrorMessage(msg) { showToast(msg, 'error', 'fa-exclamation-circle'); }

  function showToast(message, type, icon) {
    var toast = document.createElement('div');
    toast.className = 'toast-message ' + type;
    toast.innerHTML = '<i class="fas ' + icon + '"></i><span>' + escapeHtml(message) + '</span>';
    document.body.appendChild(toast);

    setTimeout(function () {
      toast.classList.add('show');
      setTimeout(function () {
        toast.classList.remove('show');
        setTimeout(function () { toast.remove(); }, 300);
      }, 3000);
    }, 100);
  }

  function formatDate(dateString) {
    var options = { year: 'numeric', month: 'short', day: 'numeric' };
    return new Date(dateString).toLocaleDateString(undefined, options);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  /* ================= Reports ================= */

  function initReportDates() {
    var today = new Date();
    var todayStr = today.toISOString().split('T')[0];
    var twoWeeksAgo = new Date(today);
    twoWeeksAgo.setDate(today.getDate() - 14);
    reportFromInput.value = twoWeeksAgo.toISOString().split('T')[0];
    reportToInput.value = todayStr;
  }

  generateReportBtn.addEventListener('click', function () {
    var from = reportFromInput.value;
    var to = reportToInput.value;

    if (!from || !to) {
      showErrorMessage('Please select both a from and to date');
      return;
    }
    if (new Date(from) > new Date(to)) {
      showErrorMessage('The "From" date must be before the "To" date');
      return;
    }

    var filtered = transactions.filter(function (t) {
      return t.date >= from && t.date <= to;
    });
    filtered.sort(function (a, b) { return new Date(a.date) - new Date(b.date); });

    var totalCredit = filtered
      .filter(function (t) { return t.type === 'income'; })
      .reduce(function (acc, t) { return acc + t.amount; }, 0);
    var totalExpense = filtered
      .filter(function (t) { return t.type === 'expense'; })
      .reduce(function (acc, t) { return acc + t.amount; }, 0);

    reportData = {
      from: from,
      to: to,
      rows: filtered,
      totalCredit: totalCredit,
      totalExpense: totalExpense,
      balance: totalCredit - totalExpense
    };

    renderReportPreview();
    reportPreview.classList.add('visible');
    reportPreview.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function renderReportPreview() {
    document.getElementById('report-period-text').textContent =
      'Report Period : ' + formatDate(reportData.from) + ' to ' + formatDate(reportData.to);
    document.getElementById('report-total-credit').textContent = reportData.totalCredit.toFixed(2);
    document.getElementById('report-total-expense').textContent = reportData.totalExpense.toFixed(2);

    var balanceCard = document.getElementById('report-balance-card');
    var balanceLabel = document.getElementById('report-balance-label');
    var balanceValue = document.getElementById('report-balance-value');
    balanceCard.classList.remove('balance-positive', 'balance-negative');

    if (reportData.balance < 0) {
      balanceLabel.textContent = 'Reimbursement Required';
      balanceValue.textContent = Math.abs(reportData.balance).toFixed(2);
      balanceCard.classList.add('balance-negative');
    } else {
      balanceLabel.textContent = 'Remaining Balance';
      balanceValue.textContent = reportData.balance.toFixed(2);
      balanceCard.classList.add('balance-positive');
    }

    var tbody = document.getElementById('report-table-body');
    tbody.innerHTML = '';

    if (reportData.rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray-medium);padding:20px;">No transactions in this period</td></tr>';
      return;
    }

    reportData.rows.forEach(function (t) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + formatDate(t.date) + '</td>' +
        '<td>' + escapeHtml(t.description) + '</td>' +
        '<td>' + escapeHtml(t.notes || '-') + '</td>' +
        '<td>' + (t.type === 'income' ? 'Credit' : 'Expense') + '</td>' +
        '<td class="amount-cell ' + t.type + '">' + (t.type === 'income' ? '+' : '-') + t.amount.toFixed(2) + '</td>';
      tbody.appendChild(tr);
    });
  }

  downloadPdfBtn.addEventListener('click', function () {
    if (!reportData) return;
    try {
      generatePdf(reportData);
    } catch (e) {
      console.error(e);
      showErrorMessage('Could not generate the PDF. Please try again.');
    }
  });

  function generatePdf(data) {
    var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDFCtor) {
      showErrorMessage('PDF library failed to load. Check your internet connection and try again.');
      return;
    }

    var doc = new jsPDFCtor({ unit: 'pt', format: 'a4' });
    var pageWidth = doc.internal.pageSize.getWidth();
    var margin = 40;

    // Header
    doc.setFont(undefined, 'bold');
    doc.setFontSize(20);
    doc.setTextColor(67, 97, 238);
    doc.text('Daily Expenses', pageWidth / 2, 50, { align: 'center' });

    doc.setFont(undefined, 'normal');
    doc.setFontSize(11);
    doc.setTextColor(100, 100, 100);
    doc.text('Report Period : ' + formatDate(data.from) + ' to ' + formatDate(data.to), pageWidth / 2, 70, { align: 'center' });

    // 3 summary cards
    var cardY = 92;
    var cardHeight = 58;
    var gap = 12;
    var cardWidth = (pageWidth - margin * 2 - gap * 2) / 3;

    var isDeficit = data.balance < 0;
    var cardsInfo = [
      { label: 'Total Credit', value: data.totalCredit.toFixed(2), color: [76, 150, 190] },
      { label: 'Total Expense', value: data.totalExpense.toFixed(2), color: [235, 30, 110] },
      {
        label: isDeficit ? 'Reimbursement Required' : 'Remaining Balance',
        value: Math.abs(data.balance).toFixed(2),
        color: isDeficit ? [220, 20, 40] : [56, 176, 0]
      }
    ];

    cardsInfo.forEach(function (card, i) {
      var x = margin + i * (cardWidth + gap);
      doc.setDrawColor(card.color[0], card.color[1], card.color[2]);
      doc.setLineWidth(1.2);
      doc.roundedRect(x, cardY, cardWidth, cardHeight, 6, 6, 'S');

      doc.setFont(undefined, 'normal');
      doc.setFontSize(8.5);
      doc.setTextColor(110, 110, 110);
      doc.text(card.label, x + cardWidth / 2, cardY + 20, { align: 'center', maxWidth: cardWidth - 12 });

      doc.setFont(undefined, 'bold');
      doc.setFontSize(14);
      doc.setTextColor(card.color[0], card.color[1], card.color[2]);
      doc.text(card.value, x + cardWidth / 2, cardY + 42, { align: 'center' });
    });

    // Table
    var tableRows = data.rows.map(function (t) {
      return [
        formatDate(t.date),
        t.description,
        t.notes || '-',
        t.type === 'income' ? 'Credit' : 'Expense',
        (t.type === 'income' ? '+' : '-') + t.amount.toFixed(2)
      ];
    });

      // Fixed widths for Date / Type / Amount / Description so they never wrap;
    // Notes shares the remaining space.
    var usableWidth = pageWidth - margin * 2;
    var dateW = 72;
    var typeW = 52;
    var amountW = 66;
    var descW = 100; // Set your desired fixed width here
    
    // Notes takes whatever remaining space is left
    var notesW = usableWidth - dateW - typeW - amountW - descW;

    doc.autoTable({
      startY: cardY + cardHeight + 22,
      head: [['Date', 'Description', 'Notes', 'Type', 'Amount']],
      body: tableRows.length ? tableRows : [['-', 'No transactions in this period', '-', '-', '-']],
      margin: { left: margin, right: margin, bottom: 40 },
      tableWidth: usableWidth,
      styles: { fontSize: 9, cellPadding: 6, overflow: 'linebreak', valign: 'top' },
      headStyles: { fillColor: [67, 97, 238], textColor: 255, fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [246, 247, 251] },
      columnStyles: {
        0: { cellWidth: dateW },
        1: { cellWidth: descW },
        2: { cellWidth: notesW },
        3: { cellWidth: typeW },
        4: { cellWidth: amountW, halign: 'right' }
      },
      didParseCell: function (hook) {
        if (hook.section === 'body' && hook.column.index === 4 && tableRows.length) {
          var rowType = data.rows[hook.row.index] && data.rows[hook.row.index].type;
          if (rowType === 'income') hook.cell.styles.textColor = [30, 130, 170];
          else if (rowType === 'expense') hook.cell.styles.textColor = [200, 30, 90];
        }
      },
      didDrawPage: function () {
        var pageHeight = doc.internal.pageSize.getHeight();
        var generatedAt = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        doc.setFont(undefined, 'normal');
        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text('Generated at ' + generatedAt, margin, pageHeight - 20);
      }
    });

    var filename = 'Expense-Report_' + data.from + '_to_' + data.to + '.pdf';
    doc.save(filename);
  }
})();
</script>
